{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="auth-register">
            <h1 class="text-center text-2xl font-extrabold text-stone-700">创建账号</h1>
            <p class="text-center text-sm text-stone-400 mt-1">完成注册后即可开始使用 AI 模拟面试平台</p>



            <form method="POST" class="mt-5 space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="grid md:grid-cols-2 gap-4">
                    <div class="form-control w-full">
                        <label for="username" class="label py-1"><span class="label-text text-stone-600">账号</span></label>
                        <input type="text" id="username" name="username" placeholder="请输入用户名" class="input input-bordered w-full" required />
                    </div>
                    <div class="form-control w-full">
                        <label for="truename" class="label py-1"><span class="label-text text-stone-600">真实姓名</span></label>
                        <input type="text" id="truename" name="truename" placeholder="请输入姓名" class="input input-bordered w-full" required />
                    </div>
                </div>

                <div class="form-control w-full">
                    <label for="password" class="label py-1"><span class="label-text text-stone-600">密码</span></label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" class="input input-bordered w-full" required />
                </div>

                <div class="divider text-xs text-stone-400 my-3">身份信息</div>

                <div class="form-control w-full">
                    <label for="role" class="label py-1"><span class="label-text text-stone-600">选择身份</span></label>
                    <select id="role" name="role" class="select select-bordered" onchange="toggleFields(this.value)">
                        <option value="student">学生</option>
                        <option value="teacher">班主任</option>
                        <option value="dept_head">系部负责人</option>
                        <option value="admin">学校负责人</option>
                    </select>
                </div>

                <div id="org-fields" class="grid md:grid-cols-2 gap-4">
                    <div class="form-control w-full">
                        <label for="department" class="label py-1"><span class="label-text text-stone-600">所属系部</span></label>
                        <input type="text" id="department" name="department" placeholder="如：数字经济系" class="input input-bordered w-full" />
                    </div>
                    <div class="form-control w-full">
                        <label for="class_name" class="label py-1"><span class="label-text text-stone-600">所属班级</span></label>
                        <input type="text" id="class_name" name="class_name" placeholder="如：23计应1班" class="input input-bordered w-full" />
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full mt-1">注册</button>
            </form>

            <div class="divider text-xs text-stone-400 my-5">已有账号？</div>
            <a href="{{ url_for('auth.login') }}" class="btn btn-ghost btn-sm w-full text-stone-600">去登录</a>

</section>
{% endblock %}
{% block scripts %}
    <script>
        function toggleFields(role) {
            const wrapper = document.getElementById('org-fields');
            const department = document.getElementById('department');
            const className = document.getElementById('class_name');
            const needsOrg = ['student', 'teacher', 'dept_head'].includes(role);

            wrapper.classList.toggle('hidden', !needsOrg);

            if (!needsOrg) {
                department.value = '';
                className.value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const roleSelect = document.getElementById('role');
            toggleFields(roleSelect.value);
        });
    </script>
{% endblock %}
