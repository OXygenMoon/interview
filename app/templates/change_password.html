{% extends "base.html" %}

{% block title %}修改密码{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-10">
    <div class="card bg-base-100 border border-base-200 shadow-sm">
        <div class="card-body">
            <h1 class="card-title text-2xl">修改密码</h1>
            {% if current_user.must_change_password %}
            <div class="alert alert-warning text-sm">
                此账号使用的是一次性初始密码，修改密码后才能继续使用系统。
            </div>
            {% endif %}
            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="form-control">
                    <span class="label-text mb-2">当前密码</span>
                    <input name="current_password" type="password" autocomplete="current-password"
                           required class="input input-bordered">
                </label>
                <label class="form-control">
                    <span class="label-text mb-2">新密码（至少 10 个字符）</span>
                    <input name="new_password" type="password" minlength="10"
                           autocomplete="new-password" required class="input input-bordered">
                </label>
                <label class="form-control">
                    <span class="label-text mb-2">确认新密码</span>
                    <input name="confirm_password" type="password" minlength="10"
                           autocomplete="new-password" required class="input input-bordered">
                </label>
                <button type="submit" class="btn btn-primary w-full">保存新密码</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
