{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<section class="auth-stage" data-testid="login-page">
    <div class="auth-story">
        <p class="club-eyebrow">嘉善技师学院 · AI 智聘平台</p>
        <h1>把紧张放一边，<br>把经验说出来。</h1>
        <p>从一次练习开始，把知识整理成答案。<br>每一步积累，都会成为你的底气。</p>
        <figure class="auth-visual" aria-hidden="true">
            <img src="{{ url_for('static', filename='images/interview-still-life.webp') }}" alt="" width="960" height="640" fetchpriority="high" decoding="async">
        </figure>
    </div>
    <div class="auth-form-panel">

        <h2>欢迎登录</h2>
        <p>使用管理员开通的账号登录，进入学生、教学或企业工作台。</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="username">账号</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" class="input input-bordered" required>
            </div>
            <div>
                <label for="password">密码</label>
                <div class="auth-password-control">
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" class="input input-bordered" required>
                    <button type="button" class="auth-password-toggle" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="显示密码">显示</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" data-testid="login-submit">登录并继续 →</button>
        </form>
        <p class="auth-helper">没有账号或忘记密码，请联系学院管理员。</p>
        <p class="auth-helper"><a href="{{ url_for('test_accounts.index') }}">使用测试账号体验 →</a></p>
    </div>
</section>
{% endblock %}
