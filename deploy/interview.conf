# Included inside Nginx's http context; preserve the existing public port.
map $http_upgrade $interview_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 20018;
    server_name _;
    client_max_body_size 10m;

    # Proxy static files too: www-data cannot traverse the project's /root path.
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $interview_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
