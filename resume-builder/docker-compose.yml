services:
  resume-builder:
    build: .
    container_name: resume-builder
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      COZE_API_TOKEN: ${COZE_API_TOKEN:?COZE_API_TOKEN must be set}
      COZE_BOT_ID: ${COZE_BOT_ID:-7594734352358047782}
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./backend/templates:/app/templates:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
